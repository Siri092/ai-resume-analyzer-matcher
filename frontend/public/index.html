<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Job Matcher</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
      transition: 0.3s;
    }

    h1 { color: #111827; }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="file"] { margin-top: 8px; }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover { background: #1d4ed8; }

    #result {
      margin-top: 30px;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .skill {
      display: inline-block;
      padding: 6px 10px;
      margin: 5px;
      border-radius: 5px;
      font-size: 14px;
    }

    .green { background: #22c55e; color: white; }
    .red { background: #ef4444; color: white; }

    #score {
      font-size: 36px;
      font-weight: bold;
      color: #2563eb;
    }

    .progress-container {
      width: 100%;
      background: #e5e7eb;
      border-radius: 8px;
      margin-top: 10px;
    }

    .progress-bar {
      width: 0%;
      height: 20px;
      border-radius: 8px;
      transition: width 0.5s;
      background: #22c55e;
    }

    .dark-mode {
      background: #111827;
      color: #f9fafb;
    }

    .dark-mode #result {
      background: #1f2933;
      color: #f9fafb;
    }

    .dark-mode button { background: #22c55e; }
  </style>
</head>

<body>

<h1>AI Resume Job Matcher</h1>

<label>Upload Resume (.txt / .pdf / .docx)</label>
<input type="file" id="resumeFile" accept=".txt,.pdf,.docx">

<label>Upload Job Description (.txt / .pdf / .docx)</label>
<input type="file" id="jdFile" accept=".txt,.pdf,.docx">

<br>

<button onclick="analyzeMatch()">Analyze Match</button>
<button onclick="checkATS()">ATS Readability Check</button>
<button onclick="optimizeResume()">Generate Resume Bullet (AI)</button>
<button onclick="downloadPDF()">Download Report</button>
<button onclick="toggleDarkMode()">Toggle Dark Mode</button>

<div id="result">

  <h2>ATS Match Score</h2>
  <div id="score">--%</div>

  <div class="progress-container">
    <div id="progress" class="progress-bar"></div>
  </div>

  <p id="explainScore" style="margin-top:10px;color:#555;"></p>

  <h3>Matched Skills</h3>
  <div id="matched"></div>

  <h3>Missing Skills</h3>
  <div id="missing"></div>

  <h3>Recommendations</h3>
  <div id="recommend"></div>

  <h3>Skill Radar Chart</h3>
  <canvas id="skillChart" width="400" height="200"></canvas>

</div>

<hr>

<!-- Resume Comparison -->
<h2>Resume Comparison (A vs B)</h2>

<input type="file" id="resumeA" accept=".txt,.pdf,.docx">
<input type="file" id="resumeB" accept=".txt,.pdf,.docx">
<input type="file" id="jdCompare" accept=".txt,.pdf,.docx">

<br>
<button onclick="compareResumes()">Compare Resumes</button>
<button onclick="downloadComparisonPDF()">Download Comparison Report</button>

<div id="compareResult" style="margin-top:15px;font-weight:bold;"></div>

<h3>Comparison History</h3>
<div id="comparisonHistory"></div>

<hr>

<!-- Score Journey -->
<h3>Your Score Journey</h3>
<canvas id="historyChart" width="400" height="200"></canvas>

<script>
  const BACKEND_URL = "http://127.0.0.1:8000";
  let skillChart = null;
  let historyChart = null;

  async function uploadFiles() {
    const resumeFile = document.getElementById("resumeFile").files[0];
    const jdFile = document.getElementById("jdFile").files[0];

    if (!resumeFile || !jdFile) {
      alert("Please upload both Resume and Job Description files.");
      return null;
    }

    const formData = new FormData();
    formData.append("resume", resumeFile);
    formData.append("jd", jdFile);

    const response = await fetch(`${BACKEND_URL}/upload`, {
      method: "POST",
      body: formData
    });

    return await response.json();
  }

  function drawRadar() {
    const ctx = document.getElementById("skillChart");

    if (skillChart) skillChart.destroy();

    skillChart = new Chart(ctx, {
      type: "radar",
      data: {
        labels: ["Backend", "Cloud", "DevOps", "ML", "NLP"],
        datasets: [{
          label: "Skill Coverage",
          data: [4, 3, 3, 2, 2],
          backgroundColor: "rgba(34,197,94,0.3)",
          borderColor: "#22c55e"
        }]
      }
    });
  }

  function saveScore(score) {
    let history = JSON.parse(localStorage.getItem("scoreHistory")) || [];
    history.push(score);
    localStorage.setItem("scoreHistory", JSON.stringify(history));
  }

  function drawHistoryChart() {
    const history = JSON.parse(localStorage.getItem("scoreHistory")) || [];
    const ctx = document.getElementById("historyChart");

    if (!ctx || history.length === 0) return;

    if (historyChart) historyChart.destroy();

    historyChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: history.map((_, i) => "Attempt " + (i + 1)),
        datasets: [{
          label: "Score Improvement",
          data: history,
          borderColor: "#2563eb",
          fill: false
        }]
      }
    });
  }

  window.onload = () => {
    drawHistoryChart();
  };

  async function analyzeMatch() {
    const dataFiles = await uploadFiles();
    if (!dataFiles) return;

    const response = await fetch(`${BACKEND_URL}/match`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dataFiles)
    });

    const data = await response.json();
    const score = data.match_score || 0;

    document.getElementById("score").innerText = score + "%";

    const bar = document.getElementById("progress");
    bar.style.width = score + "%";
    bar.style.background = score >= 70 ? "#22c55e" : score >= 40 ? "#f59e0b" : "#ef4444";

    document.getElementById("explainScore").innerHTML =
      `<b>Why ${score}%?</b><br>
       ✔ Strong technical skills<br>
       ❌ Architecture keywords missing<br>
       ❌ Leadership keywords missing`;

    const matched = data.matched_skills || [];
    const missing = data.missing_skills || [];

    document.getElementById("matched").innerHTML =
      matched.map(s => `<span class="skill green">${s}</span>`).join("");

    document.getElementById("missing").innerHTML =
      missing.map(s => `<span class="skill red">${s}</span>`).join("");

    document.getElementById("recommend").innerHTML =
      missing.map(s => `📘 Learn <b>${s}</b> from 
      <a target="_blank" href="https://www.youtube.com/results?search_query=${s}+tutorial">
      YouTube</a>`).join("<br>");

    saveScore(score);
    drawHistoryChart();
    drawRadar();
  }

  async function checkATS() {
    const resumeFile = document.getElementById("resumeFile").files[0];
    if (!resumeFile) {
      alert("Please upload a resume file.");
      return;
    }

    const formData = new FormData();
    formData.append("resume", resumeFile);

    const response = await fetch(`${BACKEND_URL}/ats-check`, {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    let output = `<b>ATS Readability Score:</b> ${data.ats_score}%<br><br>`;

    if (data.issues.length === 0) {
      output += "✅ Your resume is ATS-friendly!";
    } else {
      data.issues.forEach(issue => {
        output += "❌ " + issue + "<br>";
      });
    }

    document.getElementById("recommend").innerHTML = output;
  }

  async function optimizeResume() {
    const missing = document.getElementById("missing").innerText.trim();

    if (!missing) {
      alert("Run Analyze Match first to find missing skills.");
      return;
    }

    const dataFiles = await uploadFiles();
    if (!dataFiles) return;

    const jobRole = "Backend Developer";

    const response = await fetch(
      `${BACKEND_URL}/optimize?resume_text=${encodeURIComponent(dataFiles.resume_text)}&job_role=${jobRole}&missing_skill=${missing}`,
      { method: "POST" }
    );

    const data = await response.json();

    document.getElementById("recommend").innerHTML =
      `<b>AI-Generated Resume Bullet (STAR Method):</b><br>• ${data.bullet}`;
  }

  function saveComparison(data) {
    let history = JSON.parse(localStorage.getItem("compareHistory")) || [];
    history.push(data);
    localStorage.setItem("compareHistory", JSON.stringify(history));
  }

  function showComparisonHistory() {
    const history = JSON.parse(localStorage.getItem("compareHistory")) || [];

    document.getElementById("comparisonHistory").innerHTML = history.map((h, i) => `
      <p>
        #${i+1} → A: ${h.resumeA_score}% | B: ${h.resumeB_score}%<br>
        Winner: ${h.winner}<br>
        Reason: ${h.reason}
      </p>
    `).join("<hr>");
  }

  async function compareResumes() {
    const a = document.getElementById("resumeA").files[0];
    const b = document.getElementById("resumeB").files[0];
    const jd = document.getElementById("jdCompare").files[0];

    if (!a || !b || !jd) {
      alert("Upload Resume A, Resume B, and Job Description");
      return;
    }

    const fd = new FormData();
    fd.append("resumeA", a);
    fd.append("resumeB", b);
    fd.append("jd", jd);

    const res = await fetch(`${BACKEND_URL}/compare-resumes`, {
      method: "POST",
      body: fd
    });

    const data = await res.json();

    document.getElementById("compareResult").innerHTML = `
      Resume A: ${data.resumeA_score}%<br>
      Resume B: ${data.resumeB_score}%<br>
      🏆 Winner: <b>${data.winner}</b><br>
      📌 Reason: ${data.reason}
    `;

    saveComparison(data);
    showComparisonHistory();
  }

  function downloadComparisonPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const history = JSON.parse(localStorage.getItem("compareHistory")) || [];

    let y = 20;
    doc.text("Resume Comparison Report", 20, y);
    y += 10;

    history.forEach((h, i) => {
      doc.text(
        `#${i+1} | A: ${h.resumeA_score}% | B: ${h.resumeB_score}% | Winner: ${h.winner}\nReason: ${h.reason}`,
        20, y
      );
      y += 15;
    });

    doc.save("Resume_Comparison_Report.pdf");
  }

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let y = 20;
    doc.text("AI Resume Job Matcher Report", 20, y);
    y += 10;

    doc.text("ATS Score: " + document.getElementById("score").innerText, 20, y);
    y += 10;

    doc.text("Matched Skills: " + document.getElementById("matched").innerText, 20, y);
    y += 10;

    doc.text("Missing Skills: " + document.getElementById("missing").innerText, 20, y);
    y += 10;

    doc.text("Recommendations: " + document.getElementById("recommend").innerText, 20, y);

    doc.save("Resume_Analysis_Report.pdf");
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
  }
</script>

</body>
</html>
